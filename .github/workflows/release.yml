name: Release Prebuilt Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Static Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, x86_64-unknown-linux-gnu

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static binary (musl)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/worktrack

      - name: Build glibc binary (gnu)
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          strip target/x86_64-unknown-linux-gnu/release/worktrack

      - name: Package artifacts
        run: |
          mkdir -p dist

          # 1. Standalone static binary (pure musl, runs anywhere on any Linux distribution)
          cp target/x86_64-unknown-linux-musl/release/worktrack dist/worktrack-linux-x86_64
          chmod +x dist/worktrack-linux-x86_64

          # 2. Archives with binary and documentation
          tar -czf dist/worktrack-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-musl/release worktrack
          tar -czf dist/worktrack-linux-x86_64-musl.tar.gz -C target/x86_64-unknown-linux-musl/release worktrack
          tar -czf dist/worktrack-linux-x86_64-gnu.tar.gz -C target/x86_64-unknown-linux-gnu/release worktrack

          # 3. Generate SHA256 checksums
          cd dist
          sha256sum worktrack-linux-x86_64 worktrack-linux-x86_64.tar.gz worktrack-linux-x86_64-musl.tar.gz worktrack-linux-x86_64-gnu.tar.gz > SHA256SUMS
          cd ..

      - name: Publish Versioned GitHub Release (on tags)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/worktrack-linux-x86_64
            dist/worktrack-linux-x86_64.tar.gz
            dist/worktrack-linux-x86_64-musl.tar.gz
            dist/worktrack-linux-x86_64-gnu.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Update 'latest' Rolling Release (on push to main)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Rolling Release (Precompiled)
          body: "Готовые скомпилированные бинарники worktrack для Linux x86_64. Не требуют сборки из исходников и наличия Rust/Cargo на компьютере."
          prerelease: false
          files: |
            dist/worktrack-linux-x86_64
            dist/worktrack-linux-x86_64.tar.gz
            dist/worktrack-linux-x86_64-musl.tar.gz
            dist/worktrack-linux-x86_64-gnu.tar.gz
            dist/SHA256SUMS
